[package]
name = "rapimt_io"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rapimt_core = { path = "../rapimt_core" }
rapimt_im = { path = "../rapimt_im" }
fxhash = { workspace = true }
nom = { workspace = true }
indexmap = { workspace = true }
num_enum = { workspace = true }
funty = "2.0.0"
pest = "2.6"
pest_derive = "2.6"
derivative = "2.2.0"
csv = "1.3.1"
serde = { version = "1.0", features = ["derive"] }
hex = { version = "0.4.3", features = ["serde"] }
im-rc = { version = "*", features = ["pool", "serde"] }
lazy_static = "1.5.0"

[[example]]
name = "stanford"
path = "examples/stanford/stanford.rs"
