[package]
name = "rapimt_core"
version = "0.2.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bitvec = { workspace = true }
RuDDy = { workspace = true }
num_enum = { workspace = true }
serde = { workspace = true }
funty = { workspace = true }
oxidd = { version = "0.10.0", features = [
  "bdd",
  "manager-pointer",
  "multi-threading",
] }
phf = { version = "0.11", default-features = false }

[build-dependencies]
phf = { version = "0.11", default-features = false }
phf_codegen = "0.12.0"

[features]
default = ["dip", "sip", "sport", "dport", "tag", "lid"]
dip = []
sip = []
dport = []
sport = []
tag = []
lid = []
arc = []
