[package]
name = "rapimt"
version = "0.2.3"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.dev]
# Remember to enable this for a great improvement
# opt-level = 3
overflow-checks = false

[profile.release]
overflow-checks = false

[workspace]
members = ["crates/*"]

[workspace.dependencies]
bitvec = { version = "1" }
fxhash = { version = "0.2.1" }
funty = { version = "2.0.0" }
indexmap = { version = "2.2.5" }
log = { version = "0.4.25" }
env_logger = { version = "0.11.6" }
nom = { version = "8" }
num_enum = { version = "0.7.3" }
RuDDy = { git = "https://github.com/CrackedPoly/RuDDy.git", features = [
  "default",
] }
serde = { version = "1.0", features = ["derive", "rc"] }
snafu = { version = "0.8.5" }

[dependencies]
rapimt_internal = { path = "crates/rapimt_internal" , version = "0.2.2" }
document-features = "0.2"

[features]
default = ["dip"]

## Support encoding 32-bit destination IPv4 addresses
dip = ["rapimt_internal/dip"]

## Support encoding 32-bit source IPv4 addresses
sip = ["rapimt_internal/sip"]

## Support encoding 16-bit destination port numbers
dport = ["rapimt_internal/dport"]

## Support encoding 16-bit source port numbers
sport = ["rapimt_internal/sport"]

## Support encoding 16-bit VLAN tags
tag = ["rapimt_internal/tag"]

## Support encoding 16-bit InfiniBand lid
lid = ["rapimt_internal/lid"]

## Use `Arc` instead of `Rc` for shared objects
arc = ["rapimt_internal/arc"]
